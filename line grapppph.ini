# ── Load Required Libraries ──────────────────────────────
library(tidyverse)
library(ggplot2)
library(extrafont)
library(grid)
library(gridExtra)
library(patchwork)

# Load fonts
loadfonts()

# ── NDVI Data Transformation ─────────────────────────────
ndvi_long <- NDVI %>%
  pivot_longer(cols = -c(GEN, REP, TRT),
               names_to = "Stage", values_to = "NDVI")

stage_order <- c("Tillering", "Jointing", "Booting", "Heading", "Anthesis", "Soft Dough")
ndvi_long$Stage <- factor(ndvi_long$Stage, levels = stage_order)

ndvi_summary <- ndvi_long %>%
  group_by(TRT, Stage) %>%
  summarise(Mean_NDVI = mean(NDVI, na.rm = TRUE),
            SD_NDVI = sd(NDVI, na.rm = TRUE),
            .groups = "drop")

shape_values <- c("IRRIGATED" = 17, "DROUGHT" = 16)
color_values <- c("IRRIGATED" = "#1F78B4", "DROUGHT" = "#E31A1C")

# ── Partial Frame ────────────────────────────────────────
left_line <- annotation_custom(
  grob = linesGrob(x = unit(c(0, 0), "npc"),
                   y = unit(c(0, 1), "npc"),
                   gp = gpar(col = "black", lwd = 1))
)

bottom_line <- annotation_custom(
  grob = linesGrob(x = unit(c(0, 1), "npc"),
                   y = unit(c(0, 0), "npc"),
                   gp = gpar(col = "black", lwd = 1))
)

# ── NDVI Plot ─────────────────────────────────────────────
p <- ggplot(ndvi_summary, aes(Stage, Mean_NDVI, group = TRT, color = TRT, shape = TRT)) +
  geom_line(size = 1) +
  geom_point(size = 3) +
  geom_errorbar(aes(ymin = Mean_NDVI - SD_NDVI, ymax = Mean_NDVI + SD_NDVI),
                width = 0.15, size = 0.5) +
  scale_shape_manual(values = shape_values) +
  scale_color_manual(values = color_values) +
  theme_bw() +
  theme(
    text = element_text(family = "Times New Roman", size = 15),
    axis.title = element_text(color = "black", size = 16),
    axis.text = element_text(color = "black", size = 16),
    legend.title = element_blank(),
    legend.text = element_text(size = 9, family = "Times New Roman"),
    legend.position = c(0.05, 0.95),
    legend.justification = c(0, 1),
    legend.direction = "horizontal",
    legend.background = element_blank(),
    legend.box.background = element_blank(),
    panel.border = element_blank()
  ) +
  guides(color = guide_legend(nrow = 2),
         shape = guide_legend(nrow = 2)) +
  labs(x = "", y = "NDVI") +
  left_line + bottom_line

# ── Canopy Temperature Data ──────────────────────────────
cc_long <- CC %>%
  pivot_longer(cols = -c(GEN, REP, TRT),
               names_to = "Stage", values_to = "CC")

cc_long$Stage <- factor(cc_long$Stage, levels = stage_order)

cc_summary <- cc_long %>%
  group_by(TRT, Stage) %>%
  summarise(
    Mean_CC = mean(CC, na.rm = TRUE),
    SD_CC = sd(CC, na.rm = TRUE),
    .groups = "drop"
  )

# ── Canopy Temperature Plot ──────────────────────────────
p2 <- ggplot(cc_summary, aes(Stage, Mean_CC, group = TRT, color = TRT, shape = TRT)) +
  geom_line(size = 1) +
  geom_point(size = 3) +
  geom_errorbar(
    aes(ymin = Mean_CC - SD_CC, ymax = Mean_CC + SD_CC),
    width = 0.15, size = 0.5
  ) +
  scale_shape_manual(values = shape_values) +
  scale_color_manual(values = color_values) +
  theme_bw() +
  theme(
    text = element_text(family = "Times New Roman", size = 15),
    axis.title = element_text(color = "black", size = 16),
    axis.text = element_text(color = "black", size = 16),
    legend.title = element_blank(),
    legend.text = element_text(size = 9, family = "Times New Roman"),
    legend.position = c(0.05, 0.95),
    legend.justification = c(0, 1),
    legend.direction = "horizontal",
    legend.background = element_blank(),
    legend.box.background = element_blank(),
    panel.border = element_blank()
  ) +
  guides(color = guide_legend(nrow = 2),
         shape = guide_legend(nrow = 2)) +
  labs(x = "", y = "Canopy Temperature (°C)") +
  left_line + bottom_line

# ── Label and Adjust Plot A ──────────────────────────────
p_labeled <- p +
  labs(tag = "A.") +
  theme_minimal(base_size = 14) +
  theme(
    plot.tag = element_text(size = 18, face = "bold"),
    plot.tag.position = c(0.01, 0.95),
    plot.margin = margin(10, 10, 10, 10, "pt"),
    axis.text = element_text(color = "black", size = 16),
    axis.title = element_text(color = "black", size = 16),
    legend.title = element_blank(),
    legend.position = "bottom"
  )

# ── Label and Adjust Plot B ──────────────────────────────
p2_labeled <- p2 +
  labs(tag = "B.") +
  theme_minimal(base_size = 14) +
  theme(
    plot.tag = element_text(size = 18, face = "bold"),
    plot.tag.position = c(0.01, 0.95),
    plot.margin = margin(10, 10, 10, 10, "pt"),
    axis.text = element_text(color = "black", size = 16),
    axis.title = element_text(color = "black", size = 16),
    legend.title = element_blank(),
    legend.position = "bottom"
  ) +
  coord_cartesian(clip = "off")

# ── Combine Plots Side-by-Side ──────────────────────────
combined_plot <- (p_labeled | p2_labeled) +
  plot_layout(widths = c(1, 1)) & 
  theme(plot.margin = margin(10, 10, 10, 10, "pt"))

# ── Save Combined Plot as TIFF ──────────────────────────
tiff("Combined_NDVI_Canopy12345Temp.tiff", width = 16, height = 6, units = "in", res = 300)
print(combined_plot)
dev.off()

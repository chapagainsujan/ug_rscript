# ── 1. Load Libraries ─────────────────────────────
library(ggplot2)
library(tidyverse)
library(extrafont)
loadfonts(device = "win")

# ── 2. Prepare Correlation Data ──────────────────
# Replace with your real data
cor_data <- data.frame(
  Index = c("Yp", "Ys", "STI", "TOL", "MP", "GMP", "HMP", "YI", "SSI", "RSI", "REI", "MTSI1", "MTSI2", "GM", "MRP", "SRI"),
  PC1 = runif(16, -0.6, 0.9),  # Replace with actual PC1 correlations
  PC2 = runif(16, -0.6, 0.9)   # Replace with actual PC2 correlations
)

# Reshape to long format
cor_long <- cor_data %>%
  pivot_longer(cols = c(PC1, PC2), names_to = "Component", values_to = "Correlation")

# Define custom colors
custom_colors <- c("PC1" = "steelblue", "PC2" = "tomato3")

# ── 3. Plot ──────────────────────────────────────
p2<- ggplot(cor_long, aes(x = Index, y = Correlation, fill = Component)) +
  geom_bar(stat = "identity", position = position_dodge(width = 0.5), 
           color = "black",linewidth = 0.1,  width = 0.5) +
  facet_wrap(~Component, ncol = 2, 
             labeller = as_labeller(c(
               PC1 = "(a) PC1 vs Stress tolerance indices",
               PC2 = "(b) PC2 vs Stress tolerance indices"
             ))) +
  scale_fill_manual(values = custom_colors) +
  labs(
    x = "Irrigated-drought stress environment",
    y = "Strength of correlation"
  ) +
  theme_minimal(base_family = "Times New Roman") +
  theme(
    axis.text.x = element_text(angle = 90, vjust = 0.5, hjust = 1, size = 6, color = "black"),
    axis.text.y = element_text(size = 6, color = "black"),
    axis.title.x = element_text(size = 6, color = "black"),
    axis.title.y = element_text(size = 6, color = "black"),
    strip.text = element_text(size = 7, color = "black"),  # facet titles
    panel.grid.major.x = element_blank(),
    panel.grid.major.y = element_line(size = 0.2, color = "grey80"),
    panel.border = element_rect(colour = "black", fill = NA, linewidth = 0.3),
    legend.position = "none"
  )

# ── 4. Save Output ───────────────────────────────
ggsave("PC1_PC2_Correlation_Colored_Irrigated_Drought.tiff",
       width = 16, height = 10, units = "cm", dpi = 600, bg = "white")
# ── 1. Packages ────────────────────────────────────────────
library(FactoMineR)
library(ggplot2)
library(extrafont)
loadfonts(device = "win")

# ── 2. PCA ─────────────────────────────────────────────────
pca_res <- prcomp(FM_final_pca[, 2:18], scale. = TRUE)

eig_vals <- (pca_res$sdev)^2
pct_var  <- eig_vals / sum(eig_vals) * 100

df_plot <- data.frame(
  PC         = factor(paste0("PC", 1:7), levels = paste0("PC", 1:7)),
  Eigenvalue = eig_vals[1:7],
  Variance   = pct_var[1:7]
)

max_eig <- max(df_plot$Eigenvalue)
max_var <- 100

# ── 3. Plot ───────────────────────────────────────────────
p1 <- ggplot(df_plot, aes(x = PC)) +
  geom_bar(aes(y = Eigenvalue), stat = "identity",
           fill = "steelblue", colour = "black",
           linewidth = 0.2, width = 0.5) +
  # Eigenvalue label above bar if > 1
  geom_text(data = subset(df_plot, Eigenvalue > 1),
            aes(y = Eigenvalue + max_eig * 0.03,  # slight offset above bar
                label = round(Eigenvalue, 2)),
            colour = "black", family = "Times New Roman", size = 2) +
  # % variance line and points on secondary axis scale
  geom_line(aes(y = Variance * max_eig / max_var, group = 1),
            colour = "black", linewidth = 0.25) +
  geom_point(aes(y = Variance * max_eig / max_var),
             colour = "black", size = 1) +
  # % variance labels above bars (at % variance height)
  geom_text(aes(y = Variance * max_eig / max_var,
                label = paste0(round(Variance, 2), "%")),
            vjust = -0.6, family = "Times New Roman", size = 2) +
  scale_y_continuous(name = "Eigenvalue",
                     limits = c(0, max_eig * 1.3),
                     expand = c(0, 0),
                     sec.axis = sec_axis(~ . * max_var / max_eig,
                                         name = "Percentage of Explained Variance",
                                         breaks = seq(0, 100, 20))) +
  scale_x_discrete(name = "Principal Components") +
  theme_minimal(base_family = "Times New Roman") +
  theme(
    axis.title = element_text(size = 6),
    axis.text = element_text(size = 6),
    axis.line = element_line(size = 0.2, colour = "black"),
    panel.grid.major = element_line(size = 0.25, linetype = "dotted", colour = "grey60"),
    panel.grid.minor = element_line(size = 0.25, linetype = "dotted", colour = "grey80"),
    panel.border = element_blank()
  )

print(p1)

ggsave("PCA_Eigen_and_Variance_PC1to7_dual_axis_top_labels.tiff",
       p, width = 12, height = 10, units = "cm",
       dpi = 600, compression = "lzw", bg = "white")
# ── 1. Load libraries ─────────────────────────────────────
library(factoextra)
library(ggplot2)
library(ggrepel)
library(dplyr)
library(extrafont)  # For Times New Roman font

# Optional: Only run once
# font_import(pattern = "Times New Roman", prompt = FALSE)
loadfonts(device = "win")

# ── 2. Prepare data ───────────────────────────────────────
Final <- Stress_tolernace_indices_sandesh

# PCA
my_pca <- prcomp(Final[, 2:18], center = TRUE, scale. = TRUE)

# Eigenvalues for axis labels
eig.val <- get_eigenvalue(my_pca)

# K-means clustering on first 2 PCs
set.seed(123)
km <- kmeans(my_pca$x[, 1:2], centers = 4)
cl <- factor(km$cluster, levels = 1:4, labels = c("I", "II", "III", "IV"))

# Cluster centroids
centroids <- as.data.frame(my_pca$x[, 1:2]) %>%
  mutate(Cluster = cl) %>%
  group_by(Cluster) %>%
  summarise(across(everything(), mean), .groups = "drop")

# Individual PCA scores
ind_scores <- as.data.frame(my_pca$x[, 1:2])
colnames(ind_scores) <- c("PC1", "PC2")
ind_scores$Cluster <- cl
ind_scores$GEN <- Final$GEN

# ── 3. Create PCA biplot ───────────────────────────────────
p3 <- fviz_pca_biplot(
  my_pca,
  geom.ind = "point",
  habillage = ind_scores$Cluster,
  pointshape = 21,
  pointsize = 2.8,
  fill.ind = ind_scores$Cluster,
  col.ind = "black",
  col.var = "black",
  repel = TRUE,          # Let arrows and labels adjust automatically
  label = "var",         # Enable variable labels automatically
  axes = c(1, 2),
  ggtheme = theme_bw(base_family = "Times New Roman")
) +
  
  # Add genotype names
  geom_text_repel(
    data = ind_scores,
    aes(x = PC1, y = PC2, label = GEN, color = Cluster),
    size = 5,
    family = "Times New Roman",
    box.padding = 0.5,
    point.padding = 0.3,
    max.overlaps = 30
  ) +
  
  # Add cluster centroids
  geom_point(
    data = centroids,
    aes(PC1, PC2),
    size = 4,
    shape = 21,
    fill = "white",
    color = "black",
    stroke = 1.1
  ) +
  
  # Add cluster labels
  geom_text(
    data = centroids,
    aes(PC1, PC2, label = Cluster),
    vjust = -1.2,
    size = 5,
    family = "Times New Roman"
  ) +
  
  # Central axes
  geom_vline(xintercept = 0, linetype = "dashed", color = "gray50") +
  geom_hline(yintercept = 0, linetype = "dashed", color = "gray50") +
  
  # Axis labels
  labs(
    x = paste0("PC1 (", round(eig.val$variance.percent[1], 1), "%)"),
    y = paste0("PC2 (", round(eig.val$variance.percent[2], 1), "%)"),
    fill = "Cluster",
    color = "Cluster",
    title = "PCA Biplot - Stress Tolerance Indices"
  ) +
  
  # Styling
  scale_fill_brewer(palette = "Set2") +
  scale_color_brewer(palette = "Set2") +
  theme(
    legend.position = "right",
    legend.title = element_text(size = 12, family = "Times New Roman"),
    legend.text = element_text(size = 11, family = "Times New Roman"),
    axis.title = element_text(size = 14, family = "Times New Roman"),
    axis.text = element_text(size = 12, family = "Times New Roman"),
    panel.grid.major = element_line(color = "gray80", linetype = "dotted"),
    panel.grid.minor = element_blank()
  )

# ── 4. Save High-Resolution TIFF ──────────────────────────
tiff("PCA_FC_wSS_Clean.tiff", width = 10, height = 8, units = "in", res = 300)
print(p)
dev.off()

# ── Load Required Libraries ────────────────────────────────
library(ggplot2)
library(patchwork)

# ── Combine Only p1 and p2 Side-by-Side ────────────────────
combined_plot <- 
  (p1 | p2) +
